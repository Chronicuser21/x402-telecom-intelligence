[project]
name = "x402-agent-service"
version = "0.1.0"
description = "x402-powered API that sells data & analysis to AI agents, with built-in cost observability"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "You"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "x402[evm,extensions,fastapi,httpx]>=1.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "apscheduler>=3.10",
    "eth-tester>=0.13.0b1",
    "py-evm>=0.10.1b1",
    "mnemonic>=0.21",
    "phonenumbers>=8.13.0",
    "phonenumberslite>=8.13.0",
    "cryptography>=41.0.0",
    "cdp-sdk>=0.14.0",
    "web3>=7.16.0",
    "playwright>=1.61.0",
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[project.scripts]
x402-serve = "src.main:run"
x402-client = "src.client.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
