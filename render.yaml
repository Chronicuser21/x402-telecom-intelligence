services:
  - type: web
    name: x402-telecom-intelligence
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: "3.13"
      - key: NETWORK
        value: "eip155:8453"
      - key: SERVICE_URL
        value: "https://x402-telecom-intelligence.onrender.com"
      - key: CDP_API_KEY
        value: "29de2b4d-3e88-4268-9614-f842b43aa0cf"
